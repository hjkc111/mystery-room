name: Validate game
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npx playwright install --with-deps chrome
      - name: Four-player browser flow
        run: |
          npm start > /tmp/mystery-preview.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://localhost:4318/health && break || sleep 1; done
          npm run test:browser
          node tools/browser-resilience.mjs
          node tools/browser-ai-scenes.mjs
          node tools/browser-games.mjs
          node tools/browser-autonomous.mjs
        env:
          PORT: 4318
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-results
          path: test-results/
